<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPTV - 直播频道导航</title>
<link rel="icon" href="/jptv.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s;margin:0;padding:0}
body.light{background:#f3f4f6;color:#1f2937}
body.dark{background:#0f172a;color:#f1f5f9}
.light .panel{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border:1px solid #e5e7eb}
.dark .panel{background:rgba(30,41,59,0.85);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(20px)}
.light .card{background:rgba(255,255,255,0.9);border:1px solid #e5e7eb;color:#1f2937}
.dark .card{background:#1e293b;border:1px solid #334155;color:#f1f5f9}
.light .modal-bg{background:#fff;color:#1f2937}
.dark .modal-bg{background:#1e293b;border:1px solid #334155;color:#f1f5f9}
.light .inp{background:#fff;border:1px solid #d1d5db;color:#1f2937}
.dark .inp{background:#374151;border:1px solid #4b5563;color:#f1f5f9}
.light .tab-btn{color:#6b7280;border-bottom:2px solid transparent}
.light .tab-btn.active{color:#3b82f6;border-bottom-color:#3b82f6}
.dark .tab-btn{color:#9ca3af;border-bottom:2px solid transparent}
.dark .tab-btn.active{color:#60a5fa;border-bottom-color:#60a5fa}
.light .preview-box{background:#f9fafb;border:1px solid #e5e7eb;color:#1f2937}
.dark .preview-box{background:#1e1e1e;border:1px solid #333;color:#d4d4d4}
.card{border-radius:12px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.75rem;position:relative;user-select:none}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
.card.dragging{opacity:.4;border:2px dashed #3b82f6!important}
.card .logo{height:56px;width:auto;object-fit:contain;margin-bottom:6px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.1));pointer-events:none}
.card .cname{font-size:.78rem;font-weight:700;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inp{width:100%;padding:.5rem .75rem;border-radius:.5rem;outline:none;font-size:.875rem;transition:border-color .2s}
.inp:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.2)}
.btn{padding:.5rem 1rem;border-radius:.75rem;font-weight:600;font-size:.875rem;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:.5rem;transition:all .2s}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;color:inherit}
.btn-ghost:hover{background:rgba(0,0,0,.05)}
.dark .btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-sm{padding:.375rem .75rem;font-size:.75rem;border-radius:.5rem}
.gname-input{background:transparent;border:none;border-bottom:2px solid transparent;font-size:1.1rem;font-weight:700;outline:none;width:100%;padding:2px 0;color:inherit}
.gname-input:focus{border-bottom-color:#3b82f6}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:1rem;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-box{width:100%;max-width:700px;border-radius:16px;padding:1.5rem;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.url-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.url-row .url-note{max-width:140px;flex-shrink:0}
.url-row .url-del{flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;color:#ef4444;background:none;border:none}
.url-row .url-del:hover{background:rgba(239,68,68,.1)}
.src-editor{background:#1e1e1e;border-radius:10px;overflow:hidden;border:1px solid #333}
.src-editor .tabs{display:flex;background:#252526;border-bottom:1px solid #3c3c3c}
.src-editor .tab{padding:8px 20px;cursor:pointer;font-size:12px;font-family:Consolas,monospace;color:#969696;background:#2d2d2d;border-right:1px solid #3c3c3c;user-select:none}
.src-editor .tab.active{color:#fff;background:#1e1e1e}
.src-editor .tab:hover:not(.active){color:#ccc;background:#333}
.src-editor textarea{width:100%;min-height:260px;background:#1e1e1e;color:#d4d4d4;border:none;outline:none;resize:vertical;padding:12px;font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.6;tab-size:2}
.src-editor textarea::placeholder{color:#6a6a6a}
.src-editor textarea::-webkit-scrollbar{width:10px}
.src-editor textarea::-webkit-scrollbar-track{background:#1e1e1e}
.src-editor textarea::-webkit-scrollbar-thumb{background:#424242;border-radius:5px}
.import-tab{display:none}
.import-tab.active{display:block}
.preview-box{border-radius:8px;padding:12px;font-family:Consolas,monospace;font-size:12px;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:10px}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .3s ease}
.export-menu{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:#fff;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.15);border:1px solid #e5e7eb;min-width:160px;z-index:50;overflow:hidden}
.dark .export-menu{background:#1e293b;border-color:#334155}
.export-menu a{display:block;padding:10px 16px;font-size:14px;text-decoration:none;color:inherit;transition:background .15s}
.export-menu a:hover{background:rgba(0,0,0,.05)}
.dark .export-menu a:hover{background:rgba(255,255,255,.05)}
body.dark .badge-admin{background:rgba(34,197,94,.2);color:#4ade80}
body.light .badge-admin{background:rgba(34,197,94,.15);color:#16a34a}
</style>
</head>
<body class="light">
<div class="max-w-[1600px] mx-auto p-3 md:p-6">
<header class="panel rounded-2xl p-4 md:p-6 mb-6 fi">
  <div class="flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <div class="w-11 h-11 bg-white dark:bg-gray-800 rounded-xl flex items-center justify-center shadow overflow-hidden flex-shrink-0">
        <img src="/jptv.png" class="w-9 h-9 object-contain" alt="JPTV">
      </div>
      <div>
        <h1 class="text-xl font-bold">JPTV</h1>
        <div class="flex items-center gap-2 text-xs font-mono mt-0.5 opacity-60">
          <span>v5.0</span>
          <span id="modeBadge" class="px-2 py-0.5 rounded text-xs font-medium"></span>
        </div>
      </div>
    </div>
    <div class="flex flex-wrap items-center justify-center gap-2">
      <button onclick="toggleTheme()" id="themeBtn" class="w-9 h-9 rounded-full bg-current/10 hover:bg-current/20 flex items-center justify-center transition" title="切换主题">
        <i class="fas fa-sun"></i>
      </button>
      <div id="adminBar" class="hidden flex-wrap items-center gap-2">
        <button onclick="openImport()" class="btn btn-ghost btn-sm"><i class="fas fa-file-import"></i>导入</button>
        <div class="relative" id="exportWrap">
          <button onclick="toggleExport()" class="btn btn-ghost btn-sm"><i class="fas fa-download"></i>导出 <i class="fas fa-caret-down ml-1 text-xs"></i></button>
          <div class="export-menu" id="exportMenu">
            <a href="/api/data?export=json" target="_blank"><i class="fas fa-code w-5"></i>JSON 备份</a>
            <a href="/api/data?export=m3u" target="_blank"><i class="fas fa-list w-5"></i>M3U 订阅</a>
            <a href="/api/data?export=txt" target="_blank"><i class="fas fa-file-lines w-5"></i>TXT 订阅</a>
          </div>
        </div>
        <button onclick="saveData()" id="saveBtn" class="btn btn-primary btn-sm"><i class="fas fa-cloud-upload-alt"></i>保存并部署</button>
      </div>
    </div>
  </div>
</header>
<div id="loading" class="text-center py-20"><i class="fas fa-spinner fa-spin text-3xl opacity-40"></i><p class="mt-3 opacity-50 text-sm">加载中...</p></div>
<div id="app" class="space-y-6 pb-16"></div>
<div id="addGroupWrap" class="hidden py-8 text-center">
  <button onclick="addGroup()" class="px-8 py-4 rounded-2xl border-2 border-dashed border-current/20 hover:border-blue-500 text-current/50 hover:text-blue-500 transition font-bold flex items-center gap-2 mx-auto text-lg">
    <i class="fas fa-plus-circle"></i> 添加新分组
  </button>
</div>
</div>
<div id="channelModal" class="modal-overlay" onclick="if(event.target==this)closeChannelModal()">
  <div class="modal-box modal-bg">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold" id="chModalTitle">编辑频道</h2>
      <button onclick="closeChannelModal()" class="w-8 h-8 rounded-full hover:bg-black/10 dark:hover:bg-white/10 border-0 bg-transparent cursor-pointer"><i class="fas fa-times"></i></button>
    </div>
    <div class="space-y-3">
      <div><label class="text-xs font-medium opacity-60 block mb-1">频道名称 <span class="text-red-400">*</span></label><input id="chName" class="inp" placeholder="例如: CCTV1 综合"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs font-medium opacity-60 block mb-1">频道 ID</label><input id="chId" class="inp" placeholder="CCTV1"></div>
        <div><label class="text-xs font-medium opacity-60 block mb-1">Logo 标识</label><input id="chLogo" class="inp" placeholder="CCTV1 或完整URL"></div>
      </div>
      <div>
        <label class="text-xs font-medium opacity-60 block mb-2">播放链接 <span class="text-red-400">*</span></label>
        <div id="urlList" class="space-y-1"></div>
        <button onclick="addUrlRow()" class="mt-2 text-sm text-blue-500 hover:text-blue-600 transition border-0 bg-transparent cursor-pointer"><i class="fas fa-plus-circle"></i> 添加链接</button>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-6 pt-4 border-t border-gray-200 dark:border-gray-700">
      <button onclick="closeChannelModal()" class="btn btn-ghost btn-sm">取消</button>
      <button id="delChBtn" onclick="deleteChannel()" class="btn btn-danger btn-sm" style="display:none"><i class="fas fa-trash"></i> 删除</button>
      <button onclick="saveChannel()" class="btn btn-primary btn-sm"><i class="fas fa-check"></i> 保存</button>
    </div>
  </div>
</div>
<div id="importModal" class="modal-overlay" onclick="if(event.target==this)closeImport()">
  <div class="modal-box modal-bg">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold">导入频道数据</h2>
      <button onclick="closeImport()" class="w-8 h-8 rounded-full hover:bg-black/10 dark:hover:bg-white/10 border-0 bg-transparent cursor-pointer"><i class="fas fa-times"></i></button>
    </div>
    <div class="flex gap-0 mb-4 border-b border-gray-200 dark:border-gray-700">
      <button onclick="switchImportTab('paste')" id="impTabPaste" class="tab-btn active">粘贴代码</button>
      <button onclick="switchImportTab('file')" id="impTabFile" class="tab-btn">选择文件</button>
    </div>
    <div id="impPaste" class="import-tab active"><textarea id="impText" class="inp font-mono text-xs" rows="8" placeholder="在此粘贴 M3U / TXT / JSON 内容..." style="resize:vertical"></textarea></div>
    <div id="impFile" class="import-tab">
      <input type="file" id="impFileInput" accept=".m3u,.txt,.json,.m3u8" class="block w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 dark:file:bg-blue-900/30 dark:file:text-blue-300">
      <p class="text-xs opacity-50 mt-2">支持 .m3u / .txt / .json 文件</p>
    </div>
    <div class="mt-3 flex items-center gap-2"><span class="text-xs font-medium opacity-60">检测格式：</span><span id="impFormat" class="text-xs font-mono px-2 py-0.5 rounded bg-gray-100 dark:bg-gray-700">等待输入...</span></div>
    <div class="mt-2"><span class="text-xs font-medium opacity-60">导入方式：</span>
      <label class="inline-flex items-center gap-1 text-sm ml-2"><input type="radio" name="impMode" value="replace" checked> 替换</label>
      <label class="inline-flex items-center gap-1 text-sm ml-3"><input type="radio" name="impMode" value="append"> 追加</label>
    </div>
    <div id="impPreview" class="preview-box hidden"></div>
    <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
      <button onclick="closeImport()" class="btn btn-ghost btn-sm">取消</button>
      <button onclick="executeImport()" class="btn btn-primary btn-sm"><i class="fas fa-check"></i> 导入</button>
    </div>
  </div>
</div>
<script>
// ========== STATE ==========
let groups = [];
let isAdmin = false;
let currentToken = '';
let currentTheme = localStorage.getItem('jptv_theme') || 'light';
let sourceMode = {};
let editorCache = {};
let channelModalState = { groupIdx: -1, channelIdx: -1 };
let importDetectedFormat = '';
let dragSource = null;

// ========== THEME ==========
function applyTheme() {
  document.body.className = currentTheme;
  const icon = document.getElementById('themeBtn')?.querySelector('i');
  if (icon) icon.className = currentTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
}
function toggleTheme() {
  currentTheme = currentTheme === 'light' ? 'dark' : 'light';
  localStorage.setItem('jptv_theme', currentTheme);
  applyTheme();
}

// ========== DATA NORMALIZATION ==========
function normalizeChannel(ch) {
  let urls = [];
  if (Array.isArray(ch.url)) {
    urls = ch.url.map(u => {
      if (typeof u === 'string') return { url: u, note: '' };
      if (u && typeof u === 'object') return { url: u.url || '', note: u.note || '' };
      return null;
    }).filter(Boolean);
  } else if (typeof ch.url === 'string' && ch.url) {
    urls = [{ url: ch.url, note: '' }];
  }
  return { ...ch, url: urls };
}
function normalizeGroup(g) {
  return { group: g.group || '未分组', channels: (g.channels || []).map(normalizeChannel) };
}
function getLogoUrl(logo) {
  if (!logo) return '/jptv.png';
  if (logo.startsWith('http')) return logo;
  return 'https://gcore.jsdelivr.net/gh/fanmingming/live/tv/' + logo + '.png';
}

// ========== INIT ==========
async function init() {
  const params = new URLSearchParams(window.location.search);
  currentToken = params.get('token') || '';
  isAdmin = !!(currentToken);
  applyTheme();
  try {
    const res = await fetch('/api/data');
    if (res.ok) groups = await res.json();
  } catch(e) { /* ignore */ }
  groups = groups.map(normalizeGroup);
  renderPage();
}

// ========== RENDER ==========
function renderPage() {
  document.getElementById('loading').style.display = 'none';
  const app = document.getElementById('app');
  const badge = document.getElementById('modeBadge');
  const adminBar = document.getElementById('adminBar');
  const addWrap = document.getElementById('addGroupWrap');

  if (isAdmin) {
    badge.textContent = '管理员';
    badge.className = 'px-2 py-0.5 rounded text-xs font-medium badge-admin';
    adminBar.classList.remove('hidden');
    addWrap.classList.remove('hidden');
  } else {
    badge.textContent = '只读模式';
    badge.className = 'px-2 py-0.5 rounded text-xs font-medium opacity-60';
    adminBar.classList.add('hidden');
    addWrap.classList.add('hidden');
  }

  if (!groups || !groups.length) {
    app.innerHTML = '<div class="text-center py-20 opacity-50"><i class="fas fa-tv text-4xl mb-3"></i><p>暂无频道数据</p></div>';
    return;
  }

  app.innerHTML = groups.map((g, gi) => renderGroup(g, gi)).join('');
}

function renderGroup(g, gi) {
  const isSrc = sourceMode[gi];
  const groupName = g.group.replace(/"/g, '&quot;').replace(/'/g, "\\'");
  const upBtn = gi === 0 ? 'opacity-20 pointer-events-none' : '';
  const dnBtn = gi === groups.length - 1 ? 'opacity-20 pointer-events-none' : '';
  const srcBtn = isSrc ? 'bg-blue-500 text-white' : 'hover:bg-black/10 dark:hover:bg-white/10';

  const header = isAdmin
    ? `<input class="gname-input" value="${groupName}" onchange="groups[${gi}].group=this.value.trim()||'未命名'" placeholder="分组名称">`
    : `<h2 class="text-lg font-bold flex items-center gap-2"><i class="fas fa-layer-group text-blue-500 text-sm"></i>${g.group}</h2>`;

  const controls = isAdmin
    ? `<div class="flex items-center gap-1 flex-shrink-0">
        <button onclick="moveGroup(${gi},-1)" class="w-7 h-7 flex items-center justify-center rounded hover:bg-black/10 dark:hover:bg-white/10 text-blue-400 ${upBtn}"><i class="fas fa-chevron-up text-xs"></i></button>
        <button onclick="moveGroup(${gi},1)" class="w-7 h-7 flex items-center justify-center rounded hover:bg-black/10 dark:hover:bg-white/10 text-blue-400 ${dnBtn}"><i class="fas fa-chevron-down text-xs"></i></button>
        <div class="w-px h-4 bg-current/10 mx-1"></div>
        <button onclick="toggleSourceView(${gi})" class="px-3 py-1 rounded-lg text-xs font-medium transition ${srcBtn}"><i class="fas fa-code mr-1"></i>${isSrc ? '频道' : '源码'}</button>
        <button onclick="confirmDeleteGroup(${gi})" class="w-7 h-7 flex items-center justify-center rounded hover:bg-black/10 dark:hover:bg-white/10 text-red-400"><i class="fas fa-trash-alt text-xs"></i></button>
      </div>`
    : '';

  return `<div class="panel rounded-2xl p-4 md:p-6 fi group-panel" data-gi="${gi}">
    <div class="flex items-center justify-between mb-4 border-b border-current/10 pb-3">${header}${controls}</div>
    ${isSrc ? renderSourceEditor(gi, g) : renderCards(g, gi)}
  </div>`;
}

function renderCards(g, gi) {
  const channels = g.channels || [];
  const cardHtml = channels.map((ch, ci) => {
    const logo = getLogoUrl(ch.logo);
    const clickAttr = isAdmin
      ? `onclick="editChannel(${gi},${ci})" draggable="true" ondragstart="dragStart(event,${gi},${ci})" ondragover="event.preventDefault()" ondrop="dropCard(event,${gi},${ci})"`
      : `onclick="openChannel(${gi},${ci})"`;
    return `<div class="card" ${clickAttr}>
      <img src="${logo}" class="logo" onerror="this.src='/jptv.png'" alt="${ch.name}">
      <div class="cname">${ch.name}</div>
    </div>`;
  }).join('');

  const addBtn = isAdmin
    ? `<div onclick="editChannel(${gi},-1)" class="card border-2 border-dashed opacity-50 hover:opacity-100 text-blue-500"><i class="fas fa-plus text-2xl mb-1"></i><span class="text-xs font-bold">添加频道</span></div>`
    : '';

  return `<div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-7 xl:grid-cols-8 gap-3 card-grid">${cardHtml}${addBtn}</div>`;
}

// ========== SOURCE EDITOR ==========
function renderSourceEditor(gi, g) {
  if (!editorCache[gi]) {
    const data = JSON.parse(JSON.stringify(g));
    editorCache[gi] = { data, format: 'json', content: dataToFormat(data, 'json') };
  }
  const ec = editorCache[gi];
  const tabs = ['json', 'm3u', 'txt'].map(f =>
    `<div class="tab${ec.format === f ? ' active' : ''}" onclick="switchSourceFormat(${gi},'${f}')">${f.toUpperCase()}</div>`
  ).join('');

  return `<div class="src-editor">
    <div class="tabs flex">${tabs}
      <div class="ml-auto flex gap-2 pr-3 items-center">
        <button onclick="saveSource(${gi})" class="text-xs px-3 py-1.5 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium transition flex items-center gap-1"><i class="fas fa-check"></i> 保存</button>
      </div>
    </div>
    <textarea id="src_${gi}" spellcheck="false" placeholder="编辑 ${ec.format.toUpperCase()} 源码..." oninput="onSourceChange(${gi})">${ec.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
  </div>`;
}

function toggleSourceView(gi) {
  if (sourceMode[gi]) {
    // Switching from source to cards: save first
    const ta = document.getElementById('src_' + gi);
    if (ta) editorCache[gi].content = ta.value;
    try {
      const nd = parseFormat(editorCache[gi].content, editorCache[gi].format, groups[gi].group);
      if (nd && nd.group && nd.channels) groups[gi] = nd;
    } catch(e) {}
    delete editorCache[gi];
    sourceMode[gi] = false;
  } else {
    sourceMode[gi] = true;
    const data = JSON.parse(JSON.stringify(groups[gi]));
    editorCache[gi] = { data, format: 'json', content: dataToFormat(data, 'json') };
  }
  renderPage();
}

function onSourceChange(gi) {
  const ta = document.getElementById('src_' + gi);
  if (ta) editorCache[gi].content = ta.value;
}

function saveSource(gi) {
  const ta = document.getElementById('src_' + gi);
  if (ta) editorCache[gi].content = ta.value;
  try {
    const nd = parseFormat(editorCache[gi].content, editorCache[gi].format, groups[gi].group);
    if (nd && nd.group && Array.isArray(nd.channels)) {
      groups[gi] = nd;
      editorCache[gi].data = JSON.parse(JSON.stringify(nd));
      Swal.fire({ toast:true, position:'top-end', icon:'success', title:'源码已保存', showConfirmButton:false, timer:1200 });
    } else {
      Swal.fire({ toast:true, position:'top-end', icon:'error', title:'格式有误，请检查', showConfirmButton:false, timer:2000 });
    }
  } catch(e) {
    Swal.fire({ toast:true, position:'top-end', icon:'error', title:'解析失败: ' + e.message, showConfirmButton:false, timer:2000 });
  }
}

function switchSourceFormat(gi, newFormat) {
  const ta = document.getElementById('src_' + gi);
  if (ta) editorCache[gi].content = ta.value;
  const ec = editorCache[gi];
  if (ec.format === newFormat) return;
  try {
    const d = parseFormat(ec.content, ec.format, groups[gi].group);
    ec.format = newFormat;
    ec.content = dataToFormat(d, newFormat);
    ec.data = d;
  } catch(e) {
    Swal.fire({ toast:true, position:'top-end', icon:'error', title:'转换失败', showConfirmButton:false, timer:2000 });
  }
  renderPage();
}

function dataToFormat(data, format) {
  if (format === 'json') return JSON.stringify(data, null, 2);
  if (format === 'm3u') {
    let out = '';
    (data.channels || []).forEach(ch => {
      (ch.url || []).forEach(u => {
        const url = u.url || u;
        if (!url) return;
        out += '#EXTINF:-1 tvg-id="' + (ch.id || ch.name || '') + '" tvg-name="' + ch.name + '" tvg-logo="' + getLogoUrl(ch.logo) + '" group-title="' + data.group + '",' + ch.name + '\n' + url + '\n';
      });
    });
    return out;
  }
  if (format === 'txt') {
    let out = data.group + ',#genre#\n';
    (data.channels || []).forEach(ch => {
      (ch.url || []).forEach(u => {
        const url = u.url || u;
        if (!url) return;
        out += ch.name + ',' + url + '\n';
      });
    });
    return out;
  }
  return '';
}

function parseFormat(content, format, defaultGroup) {
  if (format === 'json') {
    const p = JSON.parse(content);
    return normalizeGroup(p);
  }
  if (format === 'm3u') {
    const all = parseM3U(content);
    const found = all.find(g => g.group === defaultGroup);
    return found || all[0] || { group: defaultGroup, channels: [] };
  }
  if (format === 'txt') {
    const all = parseTXT(content);
    const found = all.find(g => g.group === defaultGroup);
    return found || all[0] || { group: defaultGroup, channels: [] };
  }
  return null;
}
// ========== M3U/TXT PARSERS (client-side) ==========
function parseM3U(content) {
  const lines = content.split('\n');
  const map = {};
  let curGroup = '未分组', curExtinf = null;
  lines.forEach(line => {
    line = line.trim();
    if (!line) return;
    if (line.startsWith('#EXTINF:')) {
      curExtinf = line;
      const m = line.match(/group-title="([^"]*)"/);
      if (m) curGroup = m[1] || '未分组';
    } else if (!line.startsWith('#')) {
      if (curExtinf) {
        const nm = curExtinf.match(/,([^,]+)$/);
        const name = nm ? nm[1].trim() : '未知';
        const lm = curExtinf.match(/tvg-logo="([^"]*)"/);
        const logo = lm ? lm[1] : '';
        const im = curExtinf.match(/tvg-id="([^"]*)"/);
        const id = im ? im[1] : '';
        if (!map[curGroup]) map[curGroup] = [];
        const ex = map[curGroup].find(c => c.name === name);
        if (ex) { ex.url.push({ url: line, note: '' }); }
        else { map[curGroup].push({ name, id, logo, url: [{ url: line, note: '' }] }); }
        curExtinf = null;
      }
    }
  });
  return Object.entries(map).map(([group, channels]) => ({ group, channels }));
}

function parseTXT(content) {
  const lines = content.split('\n');
  const result = [];
  let curGroup = null;
  lines.forEach(line => {
    line = line.trim();
    if (!line) return;
    if (line.endsWith(',#genre#')) {
      curGroup = line.replace(',#genre#', '').trim();
      result.push({ group: curGroup, channels: [] });
    } else if (line.includes(',')) {
      const idx = line.indexOf(',');
      const name = line.substring(0, idx).trim();
      const url = line.substring(idx + 1).trim();
      if (name && url) {
        if (!result.length) { result.push({ group: '未分组', channels: [] }); curGroup = '未分组'; }
        const g = result[result.length - 1];
        if (g.group === curGroup || !curGroup) {
          g.channels.push({ name, id: name, logo: '', url: [{ url, note: '' }] });
        }
      }
    }
  });
  return result;
}

function detectFormat(content) {
  const t = content.trim();
  if (!t) return null;
  if (t.startsWith('[') || t.startsWith('{')) return 'JSON';
  if (t.startsWith('#EXTM3U') || t.startsWith('#EXTINF:')) return 'M3U';
  if (t.includes(',#genre#')) return 'TXT';
  return null;
}

// ========== READ-ONLY: OPEN CHANNEL ==========
function openChannel(gi, ci) {
  if (isAdmin) return;
  const ch = groups[gi]?.channels?.[ci];
  if (!ch) return;
  const u = ch.url || [];
  if (!u.length) return;
  const url = u[0].url || u[0];
  if (url && url.startsWith('http')) window.open(url, '_blank');
}

// ========== CHANNEL EDITOR ==========
function editChannel(gi, ci) {
  if (!isAdmin) return;
  channelModalState = { groupIdx: gi, channelIdx: ci };
  const isNew = ci === -1 || ci >= (groups[gi]?.channels?.length || 0);
  const ch = !isNew && groups[gi] ? groups[gi].channels[ci] : { name: '', id: '', logo: '', url: [] };
  document.getElementById('chModalTitle').textContent = isNew ? '添加频道' : '编辑频道';
  document.getElementById('chName').value = ch.name || '';
  document.getElementById('chId').value = ch.id || '';
  document.getElementById('chLogo').value = ch.logo || '';
  document.getElementById('delChBtn').style.display = isNew ? 'none' : 'inline-flex';
  const ul = document.getElementById('urlList');
  ul.innerHTML = '';
  const urls = Array.isArray(ch.url) && ch.url.length ? ch.url : [{ url: '', note: '' }];
  urls.forEach(u => addUrlRow(u.url || '', u.note || ''));
  document.getElementById('channelModal').classList.add('show');
}

function closeChannelModal() {
  document.getElementById('channelModal').classList.remove('show');
}

function addUrlRow(urlVal, noteVal) {
  const list = document.getElementById('urlList');
  const r = document.createElement('div');
  r.className = 'url-row';
  r.innerHTML = '<input type="text" class="inp url-input" placeholder="播放地址 URL" value="' + (urlVal||'').replace(/"/g,'&quot;') + '">'
    + '<input type="text" class="inp url-note" placeholder="备注" value="' + (noteVal||'').replace(/"/g,'&quot;') + '">'
    + '<button onclick="this.parentElement.remove()" class="url-del" title="移除链接"><i class="fas fa-times"></i></button>';
  list.appendChild(r);
}

function saveChannel() {
  const { groupIdx: gi, channelIdx: ci } = channelModalState;
  const name = document.getElementById('chName').value.trim();
  const id = document.getElementById('chId').value.trim();
  const logo = document.getElementById('chLogo').value.trim();
  const rows = document.getElementById('urlList').children;
  const urls = [];
  for (let i = 0; i < rows.length; i++) {
    const inputs = rows[i].querySelectorAll('input');
    const u = inputs[0].value.trim();
    const n = inputs[1].value.trim();
    if (u) urls.push({ url: u, note: n });
  }
  if (!name) { Swal.fire({ toast:true, position:'top-end', icon:'error', title:'请输入频道名称', timer:1500 }); return; }
  if (!urls.length) { Swal.fire({ toast:true, position:'top-end', icon:'error', title:'至少添加一个播放链接', timer:1500 }); return; }
  const ch = { name, id, logo, url: urls };
  if (ci === -1 || ci >= (groups[gi]?.channels?.length || 0)) {
    groups[gi].channels.push(ch);
  } else {
    groups[gi].channels[ci] = ch;
  }
  closeChannelModal();
  renderPage();
}

function deleteChannel() {
  const { groupIdx: gi, channelIdx: ci } = channelModalState;
  if (ci >= 0 && ci < (groups[gi]?.channels?.length || 0)) {
    const chName = groups[gi].channels[ci].name;
    Swal.fire({
      title: '删除频道?', text: '确定要删除 ' + chName + ' 吗?', icon: 'warning',
      showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: '删除', cancelButtonText: '取消'
    }).then(r => {
      if (r.isConfirmed) {
        groups[gi].channels.splice(ci, 1);
        closeChannelModal();
        renderPage();
      }
    });
  }
}

// ========== DRAG & DROP ==========
function dragStart(e, gi, ci) {
  if (!isAdmin) return;
  dragSource = { gi, ci };
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function dropCard(e, tgi, tci) {
  if (!isAdmin || !dragSource) return;
  e.preventDefault();
  const item = groups[dragSource.gi].channels.splice(dragSource.ci, 1)[0];
  groups[tgi].channels.splice(tci, 0, item);
  dragSource = null;
  renderPage();
}

// ========== GROUP MANAGEMENT ==========
function addGroup() {
  groups.push({ group: '新分组', channels: [] });
  renderPage();
  setTimeout(() => {
    const el = document.querySelectorAll('.group-panel');
    if (el.length) el[el.length - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}
function confirmDeleteGroup(gi) {
  Swal.fire({
    title: '删除分组?', text: '将删除 "' + groups[gi].group + '" 及其所有频道', icon: 'warning',
    showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: '删除', cancelButtonText: '取消'
  }).then(r => {
    if (r.isConfirmed) {
      groups.splice(gi, 1);
      delete sourceMode[gi];
      delete editorCache[gi];
      renderPage();
    }
  });
}
function moveGroup(i, dir) {
  const t = i + dir;
  if (t < 0 || t >= groups.length) return;
  [groups[i], groups[t]] = [groups[t], groups[i]];
  [sourceMode[i], sourceMode[t]] = [sourceMode[t], sourceMode[i]];
  [editorCache[i], editorCache[t]] = [editorCache[t], editorCache[i]];
  renderPage();
}

// ========== IMPORT ==========
function openImport() {
  document.getElementById('impText').value = '';
  document.getElementById('impFileInput').value = '';
  document.getElementById('impPreview').classList.add('hidden');
  document.getElementById('impFormat').textContent = '等待输入...';
  importDetectedFormat = '';
  switchImportTab('paste');
  document.getElementById('importModal').classList.add('show');
}
function closeImport() {
  document.getElementById('importModal').classList.remove('show');
}
function switchImportTab(tab) {
  document.getElementById('impTabPaste').className = 'tab-btn' + (tab === 'paste' ? ' active' : '');
  document.getElementById('impTabFile').className = 'tab-btn' + (tab === 'file' ? ' active' : '');
  document.getElementById('impPaste').className = 'import-tab' + (tab === 'paste' ? ' active' : '');
  document.getElementById('impFile').className = 'import-tab' + (tab === 'file' ? ' active' : '');
  updateImportDetection();
}
function updateImportDetection() {
  let content = '';
  if (document.getElementById('impPaste').classList.contains('active')) {
    content = document.getElementById('impText').value;
  } else {
    const file = document.getElementById('impFileInput').files[0];
    if (file) { document.getElementById('impFormat').textContent = '根据文件...'; return; }
  }
  const fmt = detectFormat(content);
  document.getElementById('impFormat').textContent = fmt || '无法识别';
  importDetectedFormat = fmt;
  const preview = document.getElementById('impPreview');
  if (content.trim()) {
    preview.textContent = content.substring(0, 500) + (content.length > 500 ? '\n...' : '');
    preview.classList.remove('hidden');
  } else {
    preview.classList.add('hidden');
  }
}
async function executeImport() {
  let content = '';
  if (document.getElementById('impPaste').classList.contains('active')) {
    content = document.getElementById('impText').value;
  } else {
    const fi = document.getElementById('impFileInput');
    if (fi.files && fi.files[0]) content = await fi.files[0].text();
  }
  if (!content.trim()) {
    Swal.fire({ toast:true, position:'top-end', icon:'error', title:'请输入或选择要导入的内容', timer:1500 });
    return;
  }
  const fmt = detectFormat(content);
  if (!fmt) {
    Swal.fire({ toast:true, position:'top-end', icon:'error', title:'无法识别内容格式', timer:2000 });
    return;
  }
  let imported;
  try {
    if (fmt === 'JSON') {
      imported = JSON.parse(content);
      if (!Array.isArray(imported)) imported = [imported];
    } else if (fmt === 'M3U') imported = parseM3U(content);
    else imported = parseTXT(content);
  } catch(e) {
    Swal.fire({ toast:true, position:'top-end', icon:'error', title:'解析失败: ' + e.message, timer:2000 });
    return;
  }
  if (!imported || !imported.length) {
    Swal.fire({ toast:true, position:'top-end', icon:'error', title:'未解析到有效数据', timer:1500 });
    return;
  }
  imported = imported.map(normalizeGroup);
  const mode = document.querySelector('input[name="impMode"]:checked').value;
  if (mode === 'replace') {
    groups = imported;
  } else {
    imported.forEach(ng => {
      const ex = groups.find(g => g.group === ng.group);
      if (ex) {
        ng.channels.forEach(nch => {
          const dup = ex.channels.find(c => c.name === nch.name);
          if (dup) {
            nch.url.forEach(u => { if (!dup.url.find(d => d.url === u.url)) dup.url.push(u); });
          } else { ex.channels.push(nch); }
        });
      } else { groups.push(ng); }
    });
  }
  closeImport();
  renderPage();
  Swal.fire({ toast:true, position:'top-end', icon:'success', title:'已导入 ' + imported.reduce((s,g) => s + g.channels.length, 0) + ' 个频道', showConfirmButton:false, timer:2000 });
}

// Attach import detection listeners
document.addEventListener('DOMContentLoaded', function() {
  const ta = document.getElementById('impText');
  if (ta) ta.addEventListener('input', updateImportDetection);
  const fi = document.getElementById('impFileInput');
  if (fi) fi.addEventListener('change', function() {
    if (!this.files || !this.files[0]) return;
    const name = this.files[0].name.toLowerCase();
    let detected = '根据内容...';
    if (name.endsWith('.m3u') || name.endsWith('.m3u8')) detected = 'M3U';
    else if (name.endsWith('.txt')) detected = 'TXT';
    else if (name.endsWith('.json')) detected = 'JSON';
    document.getElementById('impFormat').textContent = detected;
    importDetectedFormat = detected;
    const reader = new FileReader();
    reader.onload = function(e) {
      const preview = document.getElementById('impPreview');
      const txt = e.target.result.substring(0, 500);
      preview.textContent = txt + (e.target.result.length > 500 ? '\n...' : '');
      preview.classList.remove('hidden');
      const d = detectFormat(txt);
      if (d) { document.getElementById('impFormat').textContent = d; importDetectedFormat = d; }
    };
    reader.readAsText(this.files[0]);
  });
});

// ========== EXPORT MENU ==========
function toggleExport() {
  const menu = document.getElementById('exportMenu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}
document.addEventListener('click', function(e) {
  const wrap = document.getElementById('exportWrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('exportMenu').style.display = 'none';
  }
});

// ========== SAVE TO SERVER ==========
async function saveData() {
  const btn = document.getElementById('saveBtn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 部署中...';
  btn.disabled = true;
  try {
    const res = await fetch('/api/data?token=' + encodeURIComponent(currentToken), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ newData: groups })
    });
    const data = await res.json();
    if (res.ok) {
      Swal.fire({ icon:'success', title:'保存成功', text:'数据已保存，Vercel 将自动重新部署', timer:3000 });
    } else {
      throw new Error(data.error || '保存失败');
    }
  } catch(e) {
    Swal.fire({ icon:'error', title:'错误', text:e.message });
  } finally {
    btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> 保存并部署';
    btn.disabled = false;
  }
}
